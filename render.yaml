# Render blueprint — deploys the FastAPI backend.
# The build step rebuilds the sample database and the Qdrant document index,
# because Render's free instances have an ephemeral filesystem.
services:
  - type: web
    # Render hostnames are global. This name was already taken, so the live
    # service is served from multi-agent-analyst-api-22dm.onrender.com — that
    # suffixed host is what vercel.json proxies to. Renaming here would make
    # the blueprint create a second service, so leave it alone.
    name: multi-agent-analyst-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt && python db/init_db.py && python ingestion.py"
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Set a real key in the Render dashboard to leave mock mode.
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Lock this down to your Vercel domain once the frontend is deployed.
      - key: ALLOWED_ORIGINS
        value: "*"

  # Gladiator Gaming Arena — Telegram bot. Long polling ishlatadi, shuning
  # uchun web emas, worker. Bepul tarifda disk vaqtinchalik: qayta deploy
  # qilinganda SQLite bazasi nolga qaytadi. Buyurtmalar shu sababli darhol
  # Telegram xabari sifatida ham yuboriladi (va Sheets yoqilgan bo'lsa — unga).
  # Ma'lumot doimiy turishi kerak bo'lsa, pullik disk ulab DB_PATH ni
  # /var/data/gladiator.db ga o'zgartiring.
  - type: worker
    name: gladiator-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements-bot.txt"
    startCommand: "python -m bot.main"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # @BotFather bergan token.
      - key: BOT_TOKEN
        sync: false
      # Admin Telegram ID lari, vergul bilan. Botga /id yozib bilib olasiz.
      - key: ADMIN_IDS
        sync: false
      # Google Sheets — ixtiyoriy, bo'sh qoldirsa bot Sheets'siz ishlaydi.
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false

  # Claude'ga ulangan Telegram bot. Long polling — shuning uchun worker.
  # Render worker uchun `free` ni qabul qilmasa, ikki yo'l bor:
  #   1) plan: starter ga o'tkazing (pullik, eng ishonchli);
  #   2) yoki bu servisni o'chirib, qo'lda «Web Service» yarating va
  #      CLAUDE_WEBHOOK_URL ni bering — bot webhook rejimida ishlaydi
  #      (claude_bot/README.md dagi «Hostingga qo'yish» bo'limi).
  # Suhbat tarixi xotirada turadi: qayta deploy qilinganda u tozalanadi, bu
  # ataylab shunday (yozishmalar diskda qolmaydi).
  - type: worker
    name: claude-telegram-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements-claude-bot.txt"
    startCommand: "python -m claude_bot.main"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # @BotFather bergan token — Gladiator botinikidan boshqa.
      - key: CLAUDE_BOT_TOKEN
        sync: false
      # console.anthropic.com dan olinadigan kalit.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Bo'sh qolsa bot hammaga ochiq va har bir savol pul yechadi.
      - key: CLAUDE_ALLOWED_USER_IDS
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5
      - key: CLAUDE_EFFORT
        value: medium
